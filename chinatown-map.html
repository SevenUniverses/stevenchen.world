<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Chinatown NYC 3D Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL map; title chip top-left, directory panel right (bottom sheet on phones), legend bottom-left. Single "sky" look taken from the printed map. */
:root{
  --sky:#c3e7f8;      /* page + fog, matches the printed map's background */
  --ink:#1c1d21;      /* outlines, numbers, text */
  --paper:#fffdf7;    /* panels */
  --sand:#f2d4a7;     /* lots */
  --lantern:#d6302a;  /* accent red */
  --jade:#2f8a5b;     /* secondary accent */
  --muted:#5d6670;
  --line:rgba(28,29,33,.14);
  --display:"Bungee", "Arial Black", Impact, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
canvas#gl{display:block;width:100%;height:100%;touch-action:none;outline:none}

/* ---------- overlays ---------- */
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#title,#tools,#legend,#panel,#card,#hint{z-index:2}
#tip{z-index:3}
[hidden]{display:none!important}
.pin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transform-origin:50% 100%;
  display:flex;flex-direction:column;align-items:center;will-change:transform;border:0;background:none;padding:0;font:inherit;color:inherit}
.pin .dot{min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--body);
  border:2px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.pin.site .dot{background:var(--ink);color:#fff;border-color:#fff;box-shadow:0 0 0 1.5px var(--ink),0 2px 0 rgba(0,0,0,.25)}
.pin .stem{width:2px;height:9px;background:var(--ink);border-radius:1px}
.pin.svc .dot{background:#fff;min-width:20px;height:20px}
.pin.svc .dot svg{width:13px;height:13px}
.pin.bus .dot{background:#fff;border-radius:6px;padding:0 4px;gap:2px;min-width:0;height:20px}
.pin.bus .dot svg{width:13px;height:13px}
.pin.sub .dot{background:none;border:0;box-shadow:none;gap:2px;display:flex}
.pin.sub .dot i{font-style:normal;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font:700 10px/1 var(--body);color:#111;background:#fccc0a;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.pin.sub .dot i.o{background:#ff6319;color:#fff}
.pin.sub .dot i.b{background:#996633;color:#fff}
.pin.sub .dot i.g{background:#00933c;color:#fff}
.pin.sub .stem{height:6px}
.pin:hover .dot,.pin.active .dot,.pin:focus-visible .dot{transform:scale(1.25);transition:transform .12s}
.pin.active .dot{background:var(--lantern);color:#fff;border-color:#fff;box-shadow:0 0 0 2px var(--ink),0 3px 0 rgba(0,0,0,.25)}
.pin:focus-visible{outline:none}
.pin.dim{opacity:.35}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font:600 12px/1.2 var(--body);padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-34px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}

/* ---------- title ---------- */
#title{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:10px 14px 9px;box-shadow:4px 4px 0 var(--ink);max-width:calc(100vw - 32px)}
#title h1{margin:0;font:400 22px/1 var(--display);letter-spacing:.02em;color:var(--lantern);text-wrap:balance}
#title h1 span{color:var(--ink)}
#title p{margin:5px 0 0;font-size:12px;color:var(--muted)}

/* ---------- controls ---------- */
#tools{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(max(14px,env(safe-area-inset-top,0px)) + 58px);display:flex;flex-wrap:wrap;gap:6px;max-width:330px}
.tbtn{font:600 12px/1 var(--body);border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 11px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.tbtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.tbtn:focus-visible,.item:focus-visible,#sheetToggle:focus-visible,#card button:focus-visible,#card a:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}

/* ---------- legend ---------- */
#legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;box-shadow:4px 4px 0 var(--ink);font-size:12px}
#legend h2,#panel h2{margin:0 0 7px;font:400 12px/1 var(--display);letter-spacing:.06em}
#legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto auto;gap:5px 14px}
#legend li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ico{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;background:#fff;flex:none}
.ico svg{width:11px;height:11px}
.ico.n{font:700 10px/1 var(--body)}
.ico.n.k{background:var(--ink);color:#fff}

/* ---------- directory panel ---------- */
#panel{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:330px;
  background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;min-height:0}
#panelHead{padding:12px 14px 8px;border-bottom:1.5px solid var(--line)}
#search{width:100%;font:500 14px var(--body);padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
#search:focus-visible{outline:3px solid var(--lantern);outline-offset:1px}
#list{overflow:auto;padding:6px 8px 14px;min-height:0;flex:1}
#list h2{margin:12px 6px 6px}
.item{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--ink);font:inherit}
.item:hover{background:#f3ece0}
.item.active{background:#fde3df}
.item .ico{margin-top:1px;width:20px;height:20px}
.item b{display:block;font-weight:600;font-size:13px;line-height:1.25}
.item small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.empty{color:var(--muted);font-size:13px;padding:6px}
#sheetToggle{display:none}

/* ---------- info card ---------- */
#card{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(380px,calc(100vw - 32px));
  background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
#card .badge{width:34px;height:34px;font-size:15px;grid-row:span 3}
#card .kind{font:400 10px/1 var(--display);letter-spacing:.08em;color:var(--lantern)}
#card h3{margin:0;font-size:17px;line-height:1.2;text-wrap:balance}
#card .addr{font-size:13px;color:var(--muted)}
#card .row{grid-column:2 / 4;display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
#card a{font:600 12px/1 var(--body);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:6px 10px;text-decoration:none;background:#fff}
#card .x{border:0;background:none;font:700 18px/1 var(--body);cursor:pointer;color:var(--ink);padding:2px 4px}

#hint{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(28,29,33,.82);color:#fff;font-size:12px;padding:6px 10px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:15px;z-index:5;pointer-events:none}
#err p{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:14px 18px;max-width:420px;box-shadow:4px 4px 0 var(--ink)}

@media (max-width: 1100px){ #legend ul{grid-template-columns:auto} }
@media (max-width: 760px){
  #title{padding:8px 11px 7px}
  #title h1{font-size:18px}
  #title p{display:none}
  #tools{top:calc(max(14px,env(safe-area-inset-top,0px)) + 50px);max-width:calc(100vw - 32px)}
  #legend{display:none}
  #hint{display:none}
  #panel{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;height:52px;bottom:max(12px,env(safe-area-inset-bottom,0px));overflow:hidden;transition:height .25s}
  #panel.open{height:62%}
  #sheetToggle{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;font:400 13px/1 var(--display);letter-spacing:.05em;padding:16px 14px;cursor:pointer;color:var(--ink)}
  #panelHead{padding-top:0}
  #card{bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 64px)}
}
@media (prefers-reduced-motion: reduce){ .pin .dot,.tbtn,#panel{transition:none} }
</style>

<div id="app">
  <canvas id="gl" tabindex="0" aria-label="3D map of Manhattan's Chinatown. Drag to rotate, scroll or pinch to zoom, right-drag or two-finger drag to pan."></canvas>
  <div id="pins"></div>
  <div id="tip"></div>

  <header id="title">
    <h1>Chinatown <span>NYC</span></h1>

</div>

/* =====================================================================
   RASTER GRID (2 m cells): which ground is street, and roof heights
   ===================================================================== */
const CELL=2, GX0=BX0-20, GY0=BY0-20, NX=Math.ceil((BX1-BX0+40)/CELL), NY=Math.ceil((BY1-BY0+40)/CELL);
const road=new Uint8Array(NX*NY), hgt=new Float32Array(NX*NY);
const cidx=(x,y)=>{const i=Math.floor((x-GX0)/CELL), j=Math.floor((y-GY0)/CELL); return (i<0||j<0||i>=NX||j>=NY)?-1:j*NX+i;};
function rasterSeg(ax,ay,bx,by,hw,arr,val){
  const i0=Math.max(0,Math.floor((Math.min(ax,bx)-hw-GX0)/CELL)), i1=Math.min(NX-1,Math.floor((Math.max(ax,bx)+hw-GX0)/CELL));
  const j0=Math.max(0,Math.floor((Math.min(ay,by)-hw-GY0)/CELL)), j1=Math.min(NY-1,Math.floor((Math.max(ay,by)+hw-GY0)/CELL));
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy||1;
  for(let j=j0;j<=j1;j++){const py=GY0+(j+.5)*CELL; for(let i=i0;i<=i1;i++){const px=GX0+(i+.5)*CELL;
    const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/L2)); const qx=ax+dx*t-px, qy=ay+dy*t-py;
    if(qx*qx+qy*qy<=hw*hw && arr[j*NX+i]<val) arr[j*NX+i]=val; }}
}
function pip(x,y,r){ let c=false; for(let i=0,j=r.length-1;i<r.length;j=i++){ const [xi,yi]=r[i],[xj,yj]=r[j]; if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) c=!c; } return c; }
function rasterPoly(r,cb){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const [x,y] of r){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
  const i0=Math.max(0,Math.floor((x0-GX0)/CELL)), i1=Math.min(NX-1,Math.floor((x1-GX0)/CELL)), j0=Math.max(0,Math.floor((y0-GY0)/CELL)), j1=Math.min(NY-1,Math.floor((y1-GY0)/CELL));
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++) if(pip(GX0+(i+.5)*CELL,GY0+(j+.5)*CELL,r)) cb(j*NX+i);
}
function heightAt(x,y,r=6){ let m=0; for(let yy=y-r;yy<=y+r;yy+=CELL) for(let xx=x-r;xx<=x+r;xx+=CELL){const k=cidx(xx,yy); if(k>=0&&hgt[k]>m) m=hgt[k];} return m; }
for(const s of ROADS) for(let i=0;i<s.p.length-1;i++) rasterSeg(...s.p[i],...s.p[i+1],s.w/2+1,road,1);

const G = {pos:[],nor:[],uv:[],col:[],idx:[],bid:[]};
const E = [];               // (unused legacy outline buffer)
let BID = 0.5;              // per-building id → separate ink lines between touching buildings

const NOWIN=[0.03,0.03];
const C = h=>new THREE.Color(h);
function quad(a,b,c,d,n,uvs,col){
  const e1=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], e2=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  const cr=[e1[1]*e2[2]-e1[2]*e2[1], e1[2]*e2[0]-e1[0]*e2[2], e1[0]*e2[1]-e1[1]*e2[0]];
  let P=[a,b,c,d], U=uvs;
  if(cr[0]*n[0]+cr[1]*n[1]+cr[2]*n[2]<0){P=[a,d,c,b];U=[uvs[0],uvs[3],uvs[2],uvs[1]];}
  const base=G.pos.length/3;
  for(let k=0;k<4;k++){G.pos.push(...P[k]);G.nor.push(...n);G.uv.push(...U[k]);G.col.push(col.r,col.g,col.b);G.bid.push(BID);}
  G.idx.push(base,base+1,base+2,base,base+2,base+3);
}
/** box with base centre (cx,cy) in map metres, local axis (dx,dy) along width */
function box(cx,cy,dx,dy,w,d,y0,h,col,roof,opt={}){
  const nx=-dy, ny=dx, hw=w/2, hd=d/2;
  const cm=[[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([u,v])=>[cx+dx*u+nx*v, cy+dy*u+ny*v]);
  const y1=y0+h;
  const sideN=[[-nx,-ny],[dx,dy],[nx,ny],[-dx,-dy]];
  const win=opt.win!==false;
  for(let k=0;k<4;k++){
    const p=cm[k], q=cm[(k+1)%4], len=Math.hypot(q[0]-p[0],q[1]-p[1]);
    const n=[sideN[k][0],0,-sideN[k][1]];
    const uvs = win ? [[0,y0/3.4],[len/3.6,y0/3.4],[len/3.6,y1/3.4],[0,y1/3.4]] : [NOWIN,NOWIN,NOWIN,NOWIN];
    quad([p[0],y0,-p[1]],[q[0],y0,-q[1]],[q[0],y1,-q[1]],[p[0],y1,-p[1]],n,uvs,col);
  }
  if(opt.top!==false) quad(...cm.map(p=>[p[0],y1,-p[1]]),[0,1,0],[NOWIN,NOWIN,NOWIN,NOWIN],roof||col);
  if(opt.edge!==false){
    for(let k=0;k<4;k++){const p=cm[k],q=cm[(k+1)%4];
      E.push(p[0],y1,-p[1],q[0],y1,-q[1]); E.push(p[0],y0,-p[1],p[0],y1,-p[1]);
      if(y0>0.5) E.push(p[0],y0,-p[1],q[0],y0,-q[1]);
    }
  }
  return cm;
}
/** gabled roof prism along local width axis */
function gable(cx,cy,dx,dy,w,d,y0,rh,col){
  const nx=-dy, ny=dx, hw=w/2, hd=d/2;
  const P=(u,v,y)=>[cx+dx*u+nx*v, y, -(cy+dy*u+ny*v)];
  const a=P(-hw,-hd,y0), b=P(hw,-hd,y0), c=P(hw,0,y0+rh), dd=P(-hw,0,y0+rh), e=P(hw,hd,y0), f=P(-hw,hd,y0);
  const s=Math.hypot(rh,hd);
  const n1=[(-nx*rh)/s, hd/s, (ny*rh)/s], n2=[(nx*rh)/s, hd/s, -(ny*rh)/s];
  quad(a,b,c,dd,n1,[NOWIN,NOWIN,NOWIN,NOWIN],col);
  quad(f,e,c,dd,n2,[NOWIN,NOWIN,NOWIN,NOWIN],col);
  // gable ends as degenerate quads (triangles)
  const ne=[dx,0,-dy], nw=[-dx,0,dy];
  quad(b,e,c,c,ne,[NOWIN,NOWIN,NOWIN,NOWIN],col);
  quad(a,f,dd,dd,nw,[NOWIN,NOWIN,NOWIN,NOWIN],col);
  E.push(...c,...dd);
}

/** triangle with automatic upward-facing normal (roofs) */
function triUp(a,b,c,col){
  const e1=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], e2=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  let n=[e1[1]*e2[2]-e1[2]*e2[1], e1[2]*e2[0]-e1[0]*e2[2], e1[0]*e2[1]-e1[1]*e2[0]];
  let P=[a,b,c]; if(n[1]<0){ P=[a,c,b]; n=n.map(v=>-v); }
  const l=Math.hypot(...n)||1; n=n.map(v=>v/l);
  const base=G.pos.length/3;
  for(const p of P){G.pos.push(...p);G.nor.push(...n);G.uv.push(...NOWIN);G.col.push(col.r,col.g,col.b);G.bid.push(BID);}
  G.idx.push(base,base+1,base+2);
}

function lam(hex,opts={}){const k=hex+JSON.stringify(opts); return matCache[k]||(matCache[k]=new THREE.MeshToonMaterial({color:hex,gradientMap:TOON,...opts}));}
function add(geom,hex,x,y,h,opts={}){

  if(opts.ry) m.rotation.y=opts.ry; if(opts.rx) m.rotation.x=opts.rx; if(opts.rz) m.rotation.z=opts.rz;
  if(opts.s) m.scale.set(...opts.s);
  extras.add(m); return m;
}

function pagoda(x,y,h,size,tiers=3,roof='#3f9064',trim='#f2c443',wall='#d8382f'){
  let y0=h;
  for(let t=0;t<tiers;t++){
    const s=size*(1-t*0.22);
    add(new THREE.BoxGeometry(s*1.22,s*0.09,s*1.22),trim,x,y,y0+s*0.045);
    add(new THREE.ConeGeometry(s*0.84,s*0.34,4),roof,x,y,y0+s*0.09+s*0.17,{ry:Math.PI/4});
    y0+=s*0.09+s*0.3;
    if(t<tiers-1){ add(new THREE.BoxGeometry(s*0.52,s*0.34,s*0.52),wall,x,y,y0+s*0.17); y0+=s*0.34; }
  }
  add(new THREE.CylinderGeometry(size*0.03,size*0.03,size*0.35,6),'#f2c443',x,y,y0+size*0.17);
  add(new THREE.SphereGeometry(size*0.07,10,8),'#f2c443',x,y,y0+size*0.35);
  return y0+size*0.4;
}

function pickWall(e){
  if(e.c) return C(e.c);
  switch(e.mt){ case 1: return pick(BRICK); case 2: case 6: return pick(CREAM); case 3: return pick(GREYS); case 4: return pick(GLASS); case 5: return C('#a9b0b6'); }
  const r=rnd(); if((e.h||0)>60) return r<0.5?pick(CREAM):r<0.8?pick(GREYS):pick(GLASS);
  return r<0.64?pick(BRICK):r<0.86?pick(CREAM):pick(GREYS);
}

    const m=add(new THREE.BoxGeometry(len+0.4,3,width),col,B.x+B.dx*sm,B.y+B.dy*sm,(h1+h2)/2-1.5,{});
    m.rotation.set(0,ang,0); m.rotateZ(Math.atan2(h2-h1,s2-s));
    if(rail){ const r=add(new THREE.BoxGeometry(len+0.4,0.3,width-3),rail,B.x+B.dx*sm,B.y+B.dy*sm,(h1+h2)/2+0.05); r.rotation.set(0,ang,0); r.rotateZ(Math.atan2(h2-h1,s2-s)); }
  }
}

    this.tail.position.copy(tl).addScaledVector(tt,-1.2*R); this.tail.quaternion.setFromUnitVectors(Y,tt.clone().negate());
  }
}

/* =====================================================================
   FIREWORKS
   ===================================================================== */
const dotTex=(()=>{const c=document.createElement('canvas'); c.width=c.height=32; const g=c.getContext('2d'); const gr=g.createRadialGradient(16,16,0,16,16,16); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.45,'rgba(255,255,255,0.9)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,32,32); const t=new THREE.CanvasTexture(c); return t;})();
const FW_COLORS=['#e53935','#f2b632','#2b6cb0','#2f8a5b','#c2185b','#7b3fb3','#ff7a1a'];
const bursts=[]; let nextFw=0.6;
function spawnFirework(){
  const n=150, pos=new Float32Array(n*3), vel=new Float32Array(n*3), col=new Float32Array(n*3);
  const ox=lerp(BX0+120,BX1-120,rnd()), oy=lerp(BY0+120,BY1-120,rnd()), o=W(ox,oy,190+rnd()*110);
  const c1=C(pick(FW_COLORS)), c2=C(pick(FW_COLORS));
  const sp=34+rnd()*18;
  for(let i=0;i<n;i++){
    const u=rnd()*2-1, th=rnd()*Math.PI*2, s=Math.sqrt(1-u*u), v=sp*(0.75+rnd()*0.25);
    vel[i*3]=s*Math.cos(th)*v; vel[i*3+1]=u*v; vel[i*3+2]=s*Math.sin(th)*v;
    pos[i*3]=o.x; pos[i*3+1]=o.y; pos[i*3+2]=o.z; const cc=i%3?c1:c2; col[i*3]=cc.r; col[i*3+1]=cc.g; col[i*3+2]=cc.b;
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:16,map:dotTex,vertexColors:true,transparent:true,depthWrite:false,alphaTest:0.02});
  const p=new THREE.Points(g,m); p.frustumCulled=false; scene.add(p);
  const tr=new Float32Array(n*6), tc=new Float32Array(n*6); for(let i=0;i<n;i++){ for(let k=0;k<2;k++){ tc[i*6+k*3]=col[i*3]; tc[i*6+k*3+1]=col[i*3+1]; tc[i*6+k*3+2]=col[i*3+2]; } }
  const tg=new THREE.BufferGeometry(); tg.setAttribute('position',new THREE.BufferAttribute(tr,3)); tg.setAttribute('color',new THREE.BufferAttribute(tc,3));
  const tl=new THREE.LineSegments(tg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true})); tl.frustumCulled=false; scene.add(tl); p.userData.trail=tl;
  // rising streak
  const sg=new THREE.BufferGeometry().setFromPoints([W(ox,oy,0),o.clone()]);
  const sl=new THREE.Line(sg,new THREE.LineBasicMaterial({color:c1,transparent:true,opacity:0.6})); scene.add(sl);
  bursts.push({p,vel,age:0,life:2.6,streak:sl});
}
function updateFireworks(dt){
  for(let b=bursts.length-1;b>=0;b--){
    const B=bursts[b]; B.age+=dt; const pos=B.p.geometry.attributes.position.array, v=B.vel;
    const drag=Math.pow(0.35,dt);
    for(let i=0;i<v.length;i+=3){ v[i]*=drag; v[i+1]=v[i+1]*drag-14*dt; v[i+2]*=drag; pos[i]+=v[i]*dt; pos[i+1]+=v[i+1]*dt; pos[i+2]+=v[i+2]*dt; }
    B.p.geometry.attributes.position.needsUpdate=true;
    const f=B.age/B.life; B.p.material.opacity=Math.max(0,1-f*f); B.p.material.size=16+f*6;
    { const tl=B.p.userData.trail, ta=tl.geometry.attributes.position.array; for(let i=0,j=0;i<pos.length;i+=3,j+=6){ ta[j]=pos[i]; ta[j+1]=pos[i+1]; ta[j+2]=pos[i+2]; ta[j+3]=pos[i]-v[i]*0.35; ta[j+4]=pos[i+1]-v[i+1]*0.35; ta[j+5]=pos[i+2]-v[i+2]*0.35; } tl.geometry.attributes.position.needsUpdate=true; tl.material.opacity=B.p.material.opacity; }
    B.streak.material.opacity=Math.max(0,0.6-B.age*1.4);
    if(B.age>B.life){ const tl=B.p.userData.trail; scene.remove(B.p,B.streak,tl); tl.geometry.dispose(); tl.material.dispose(); B.p.geometry.dispose(); B.p.material.dispose(); B.streak.geometry.dispose(); B.streak.material.dispose(); bursts.splice(b,1); }
  }
}

/* =====================================================================
   CAMERA TWEENS + UI BUTTONS
   ===================================================================== */
let tween=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(point,dist){
  const t1=new THREE.Vector3(point.x,Math.min(point.y*0.5,30),point.z);
  const dir=camera.position.clone().sub(controls.target).normalize();
  const el=Math.max(0.55,Math.min(1.0,Math.asin(dir.y)));
  const az=Math.atan2(dir.x,dir.z);
  const p1=t1.clone().add(new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el)).multiplyScalar(dist));
  startTween(p1,t1);
}
function startTween(p1,t1){
  if(reduce){camera.position.copy(p1);controls.target.copy(t1);return;}
  tween={p0:camera.position.clone(),t0:controls.target.clone(),p1,t1,start:performance.now(),dur:1100};
}
function stepTween(now){
  if(!tween) return; let k=Math.min(1,(now-tween.start)/tween.dur); const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); if(k>=1) tween=null;
}
controls.addEventListener('start',()=>{tween=null;});
const btn=id=>document.getElementById(id);
btn('bReset').addEventListener('click',()=>{const p=homePose(); startTween(p.pos,p.target);});

/* =====================================================================
   INK PASS — re-render surface ids, normals and depth, then draw dark
   lines wherever any of them changes. This is what gives the hand-inked look.
   ===================================================================== */
const ink = (()=>{
  const color=new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType,samples:4});
  const id=new THREE.WebGLRenderTarget(1,1,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});
  id.depthTexture=new THREE.DepthTexture(1,1,THREE.UnsignedIntType);
  const idVS=`
    uniform float uId; attribute float bid; varying vec3 vN; varying float vId;
    #include <common>
    void main(){
      #include <beginnormal_vertex>
      #include <defaultnormal_vertex>
      #include <begin_vertex>
      #include <project_vertex>
      vN = normalize(transformedNormal);
      float inst = 0.0;
      #ifdef USE_INSTANCING
        inst = fract(float(gl_InstanceID)*0.6180339);
      #endif
      vId = fract(uId + bid + inst);
    }`;
  const idFS=`varying vec3 vN; varying float vId;
    void main(){ vec3 n=normalize(vN); if(!gl_FrontFacing) n=-n; gl_FragColor=vec4(n*0.5+0.5, 0.02+vId*0.97); }`;
  const mats=new Map();
  const matFor=o=>{
    let m=o.userData.idMat; if(m) return m;
    const side=Array.isArray(o.material)?THREE.FrontSide:o.material.side;
    const uid=o.userData.inkId ?? Math.random();
    const src=Array.isArray(o.material)?o.material[0]:o.material;
    m=new THREE.ShaderMaterial({vertexShader:idVS,fragmentShader:idFS,side,uniforms:{uId:{value:uid}},polygonOffset:!!src.polygonOffset,polygonOffsetFactor:src.polygonOffsetFactor||0,polygonOffsetUnits:src.polygonOffsetUnits||0});
    o.userData.idMat=m; return m;
  };
  const quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const comp=new THREE.ShaderMaterial({
    uniforms:{tColor:{value:color.texture},tId:{value:id.texture},tDepth:{value:id.depthTexture},texel:{value:new THREE.Vector2()},
      near:{value:camera.near},far:{value:camera.far},thick:{value:1},fogNear:{value:FOG.near},fogFar:{value:FOG.far},inkCol:{value:new THREE.Color('#2b2220')},
      strength:{value:0.9}},
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
    fragmentShader:`
      #include <packing>
      uniform sampler2D tColor,tId,tDepth; uniform vec2 texel; uniform float near,far,thick,fogNear,fogFar,strength; uniform vec3 inkCol;
      varying vec2 vUv;
      float vz(vec2 uv){ return -perspectiveDepthToViewZ(texture2D(tDepth,uv).x, near, far); }
      void main(){
        vec4 c=texture2D(tColor,vUv);
        vec4 iC=texture2D(tId,vUv); float dC=vz(vUv); vec3 nC=iC.xyz*2.-1.;
        float e=0.;
        float dS[4];
        for(int i=0;i<4;i++){
          vec2 o = i==0?vec2(1.,0.):i==1?vec2(-1.,0.):i==2?vec2(0.,1.):vec2(0.,-1.);
          vec2 uv=vUv+o*texel*thick;
          vec4 iN=texture2D(tId,uv); float dN=vz(uv); vec3 nN=iN.xyz*2.-1.;
          dS[i]=dN;
          if(abs(iC.a-iN.a)>0.003) e=1.;
          e=max(e, smoothstep(0.10,0.30, 1.-dot(nC,nN)));
        }
        float lap=max(abs(dS[0]+dS[1]-2.*dC), abs(dS[2]+dS[3]-2.*dC))/max(1.,dC);
        e=max(e, smoothstep(0.004,0.012, lap));
        e*=1.-smoothstep(fogNear*0.7,fogFar*0.8,dC);
        if(iC.a<0.01) e=0.;
        gl_FragColor=vec4(mix(c.rgb,inkCol,e*strength),1.);
        #include <colorspace_fragment>
      }`,
    depthTest:false,depthWrite:false});
  const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),comp); const qs=new THREE.Scene(); qs.add(quad);
  const swapped=[], hidden=[];
  return {
    setNear(n,f){ comp.uniforms.near.value=n; comp.uniforms.far.value=f; },
    setFog(n,f){ comp.uniforms.fogNear.value=n; comp.uniforms.fogFar.value=f; },
    setSize(w,h){ color.setSize(w,h); id.setSize(w,h); comp.uniforms.texel.value.set(1/w,1/h); comp.uniforms.thick.value=Math.max(1,DPR*0.75); },
    render(){
      swapped.length=0; hidden.length=0;
      scene.traverse(o=>{
        if(!o.visible) return;
        if((o.isMesh) && !o.userData.noInk){ o.userData.mat=o.material; o.material=matFor(o); swapped.push(o); }
        else if(o.isMesh||o.isLine||o.isPoints){ o.visible=false; hidden.push(o); }
      });
      scene.background=null; scene.fog=null;
      renderer.setClearColor(0x000000,0);
      renderer.setRenderTarget(id); renderer.clear(); renderer.render(scene,camera);
      for(const o of swapped) o.material=o.userData.mat;
      for(const o of hidden) o.visible=true;
      scene.background=SKY; scene.fog=FOG;
      renderer.setRenderTarget(color); renderer.render(scene,camera);
      renderer.setRenderTarget(null); renderer.render(qs,quadCam);
    }
  };
})();

/* =====================================================================
   RESIZE + RENDER LOOP
   ===================================================================== */
function resize(){
  const w=canvas.clientWidth, h=canvas.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); ink.setSize(Math.floor(w*DPR),Math.floor(h*DPR));
  // fit home view to narrow screens
  HOME.dist = Math.min(4300, 2900*Math.max(1, 1.2/Math.max(0.4,camera.aspect)));
}
window.addEventListener('resize',resize); resize();
{const p=homePose(); camera.position.copy(p.pos); controls.target.copy(p.target);}

const v3=new THREE.Vector3(); let last=performance.now(), simT=0;
renderList();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!reduce) simT+=dt;
  stepTween(now); controls.update();
  { const d=camera.position.distanceTo(controls.target); FOG.near=d+1800; FOG.far=d+7000; ink.setFog(FOG.near,FOG.far);
    const nr=THREE.MathUtils.clamp(d*0.04,2,160); if(Math.abs(nr-camera.near)>0.5){ camera.near=nr; camera.updateProjectionMatrix(); } ink.setNear(camera.near,camera.far); }
  if(toggles.dragons) dragons.forEach(d=>d.update(simT+(reduce?3:0)));
  if(toggles.fire && !reduce){ nextFw-=dt; if(nextFw<=0){ spawnFirework(); nextFw=0.9+rnd()*1.6; } }
  updateFireworks(dt);
  ink.render();
  // pins
  const w=canvas.clientWidth, h=canvas.clientHeight;
  const camD=camera.position.distanceTo(controls.target);
  const small=camD>2600;
  for(const p of ALL){
    v3.copy(p.world).project(camera);
    if(v3.z>1||v3.x<-1.1||v3.x>1.1||v3.y<-1.1||v3.y>1.1){p.el.style.display='none';continue;}
    p.el.style.display='';
    const x=(v3.x+1)/2*w, y=(1-v3.y)/2*h;
    const s=(p.kind==='svc'||p.kind==='bus'||p.kind==='sub')?(small?0.7:0.88):(small?0.85:1);
    p.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%) scale(${s})`;
    p.el.style.zIndex=p.id===selected?99999:Math.round((1-v3.z)*90000);
    if(p.hover){tip.style.left=x+'px'; tip.style.top=y+'px';}
  }
  requestAnimationFrame(frame);
}
if(reduce) dragons.forEach(d=>d.update(3));
requestAnimationFrame(frame);
